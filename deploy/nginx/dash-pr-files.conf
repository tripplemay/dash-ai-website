# Include this snippet inside the production `server {}` block, together with
# `dash-pr-upstream.conf` in the `http {}` context.
#
# /files must never use `root`/`try_files`: doing so bypasses the application
# session and resources.enabled checks. The upstream receives the original
# path and the Next proxy rewrites it to /api/file/files/....

location = /_dash_auth_check {
    internal;
    proxy_pass http://dash_pr_app/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /files {
    auth_request /_dash_auth_check;
    proxy_pass http://dash_pr_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 15m;
    send_timeout 15m;
    proxy_max_temp_file_size 0;
}

location ^~ /files/ {
    auth_request /_dash_auth_check;
    # The upstream application performs the final enabled-state/path check;
    # auth_request prevents unauthenticated direct-file access at nginx.
    proxy_pass http://dash_pr_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 15m;
    send_timeout 15m;
    proxy_max_temp_file_size 0;
}
