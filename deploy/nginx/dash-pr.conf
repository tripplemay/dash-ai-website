# DASH AI production vhost template.
#
# Install this file as /etc/nginx/sites-enabled/dash-pr (or include it from
# the nginx `http {}` context). It is self-contained: the equivalent of
# dash-pr-upstream.conf and dash-pr-files.conf is inlined below. Do not also
# include the files snippet in this server, or nginx will see duplicate
# location definitions. The upstream uses a release-specific name so a stale
# `dash_pr_app` include can be migrated without a duplicate-upstream failure.
# The snippets remain available for setups that compose the server from smaller
# includes.

upstream dash_pr_release_app {
    server 127.0.0.1:3517;
    keepalive 16;
}

# Keep the ACME challenge reachable while all other HTTP traffic moves to TLS.
server {
    listen 80;
    listen [::]:80;
    server_name pr.dashedu.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pr.dashedu.net;

    root /opt/dash-pr/public;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/pr.dashedu.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pr.dashedu.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:dash_pr_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 64m;

    # Public, immutable marketing assets. These locations intentionally do
    # not use auth_request or proxy_pass.
    location = /assets {
        return 301 /assets/;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The brand manual is a public static site under public/brand.
    location = /brand {
        return 301 /brand/;
    }

    location ^~ /brand/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Internal auth subrequest for protected files. The application checks
    # both the real session and resources.enabled before returning 2xx.
    location = /_dash_auth_check {
        internal;
        proxy_pass http://dash_pr_release_app/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never add root/try_files to these locations: doing so would expose the
    # public/files volume without the session and enabled-state checks.
    location = /files {
        auth_request /_dash_auth_check;
        proxy_pass http://dash_pr_release_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 15m;
        send_timeout 15m;
        proxy_max_temp_file_size 0;
    }

    location ^~ /files/ {
        auth_request /_dash_auth_check;
        proxy_pass http://dash_pr_release_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 15m;
        send_timeout 15m;
        proxy_max_temp_file_size 0;
    }

    location / {
        proxy_pass http://dash_pr_release_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
