# CORECOORD production vhost template.
#
# Install this file as /etc/nginx/sites-enabled/dash-pr (or include it from
# the nginx `http {}` context). It is self-contained: the equivalent of
# dash-pr-upstream.conf and dash-pr-files.conf is inlined below. Do not also
# include the files snippet in this server, or nginx will see duplicate
# location definitions. The upstream uses a release-specific name so a stale
# `dash_pr_app` include can be migrated without a duplicate-upstream failure.
# The snippets remain available for setups that compose the server from smaller
# includes.

upstream dash_pr_release_app {
    server 127.0.0.1:3517;
    keepalive 16;
}

# Keep the ACME challenge reachable while all other HTTP traffic moves to TLS.
server {
    listen 80;
    listen [::]:80;
    server_name pr.dashedu.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pr.dashedu.net;

    root /opt/dash-pr/public;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/pr.dashedu.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pr.dashedu.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:dash_pr_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 64m;

    # Public CORECOORD assets. The 2026.1 path is kept on a short cache while
    # the approved package can still receive corrections without a URL bump.
    location = /assets {
        return 301 /assets/;
    }

    location ^~ /assets/brand/corecoord/2026.1/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Course templates and the printable VI guide are listed in the protected
    # resource catalogue as well as being shipped beside the public manual.
    # Require a real session when they are addressed through their static path.
    location ^~ /assets/brand/corecoord/2026.1/vi-system-2026/manual/output/pdf/ {
        auth_request /_dash_auth_check;
        try_files $uri =404;
        add_header Cache-Control "private, no-store" always;
    }

    location ^~ /assets/brand/corecoord/2026.1/vi-system-2026/deliverables/templates/ {
        auth_request /_dash_auth_check;
        try_files $uri =404;
        add_header Cache-Control "private, no-store" always;
    }

    # The previous DASH asset trees are intentionally retired. Returning 410
    # prevents an old file left on the persistent volume from remaining a
    # publicly reachable brand surface after the CORECOORD cutover.
    location ^~ /assets/ext/ {
        return 410;
    }

    location ^~ /assets/img/ {
        return 410;
    }

    location ^~ /assets/icons/ {
        return 410;
    }

    location ^~ /assets/ {
        # Only the versioned CORECOORD prefix above is an approved public
        # asset surface. The persistent volume can contain files from older
        # releases, so unknown paths must not fall through to try_files.
        return 410;
    }

    # Retire the pre-2026 public manual path instead of exposing stale assets.
    location = /brand {
        return 301 /assets/brand/corecoord/2026.1/vi-system-2026/manual/index.html;
    }

    location ^~ /brand/ {
        return 301 /assets/brand/corecoord/2026.1/vi-system-2026/manual/index.html;
    }

    # Internal auth subrequest for protected files. The application checks
    # both the real session and resources.enabled before returning 2xx.
    location = /_dash_auth_check {
        internal;
        proxy_pass http://dash_pr_release_app/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never add root/try_files to these locations: doing so would expose the
    # public/files volume without the session and enabled-state checks.
    location = /files {
        auth_request /_dash_auth_check;
        proxy_pass http://dash_pr_release_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 15m;
        send_timeout 15m;
        proxy_max_temp_file_size 0;
    }

    location ^~ /files/ {
        auth_request /_dash_auth_check;
        proxy_pass http://dash_pr_release_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 15m;
        send_timeout 15m;
        proxy_max_temp_file_size 0;
    }

    location / {
        proxy_pass http://dash_pr_release_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
