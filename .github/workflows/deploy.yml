name: build-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本取自 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 与 VPS 侧 /opt/node22 保持同一大版本（better-sqlite3 原生模块 ABI 一致）
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Quality and migration smoke test
        run: |
          set -euo pipefail
          pnpm run lint
          pnpm exec tsc --noEmit --pretty false
          pnpm brand:check
          node --check scripts/package-seed-runtime.mjs
          node --check scripts/migrate-auth.mjs
          node --check scripts/check-db.mjs
          node --check scripts/smoke-standalone.mjs
          node --check scripts/prepare-pm2-config.mjs
          test "$(grep -Ec 'location = /files' deploy/nginx/dash-pr-files.conf)" -eq 1
          grep -Eq 'location \^~ /files/' deploy/nginx/dash-pr-files.conf
          grep -Eq '^upstream dash_pr_release_app' deploy/nginx/dash-pr.conf
          test "$(grep -Ec 'auth_request /_dash_auth_check' deploy/nginx/dash-pr.conf)" -eq 4
          for retired_prefix in ext img icons; do
            grep -Eq "location \\^~ /assets/${retired_prefix}/" deploy/nginx/dash-pr.conf
          done
          grep -Fq '    location ^~ /assets/ {' deploy/nginx/dash-pr.conf
          grep -A8 -F '    location ^~ /assets/ {' deploy/nginx/dash-pr.conf | grep -Fq 'return 410'
          awk '/location = \/files|location \^~ \/files\// { inside=1 } inside { print } inside && /^    }$/ { inside=0 }' deploy/nginx/dash-pr.conf \
            | grep -Eq 'root|try_files' && {
              echo 'The production /files locations must not expose a filesystem root' >&2
              exit 1
            } || true
          if grep -En '^[[:space:]]*(root|try_files)[[:space:]]' deploy/nginx/dash-pr-files.conf; then
            echo 'The protected /files nginx snippet must not expose a filesystem root' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dash-ai-migration"
          DASH_AUTH_DB="$RUNNER_TEMP/dash-ai-migration/check.db" pnpm migrate

      - name: Build
        # BETTER_AUTH_SECRET 仅为构建期占位（生产构建要求该变量存在）；
        # 运行时真实密钥只存在于 VPS 的 pm2 ecosystem 配置中。
        env:
          BETTER_AUTH_SECRET: ci-build-placeholder-012345678901234567890123
          BETTER_AUTH_URL: https://pr.dashedu.net
          DASH_PUBLIC_ORIGIN: https://pr.dashedu.net
          # Next 的静态分析可能初始化 better-auth/db。把构建期数据库放到
          # runner 临时目录，避免在 checkout 或 standalone 输出中生成生产数据库。
          DASH_AUTH_DB: ${{ runner.temp }}/dash-auth-ci/dash-auth.db
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/dash-auth-ci"
          mkdir -p "$RUNNER_TEMP/dash-auth-ci"
          # Pre-create the build database and switch it to WAL before Next's
          # static workers import auth/db modules in parallel.
          DASH_AUTH_DB="$RUNNER_TEMP/dash-auth-ci/dash-auth.db" pnpm migrate
          pnpm build

          # standalone 不得携带任何 SQLite 主库或 journal/WAL/SHM 文件。
          db_artifact="$(find .next/standalone \( -type f -o -type l \) \( \
            -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.db-journal' \
          \) -print -quit)"
          if [[ -n "$db_artifact" ]]; then
            echo "Refusing to package SQLite artifact: $db_artifact" >&2
            find .next/standalone \( -type f -o -type l \) \( \
              -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.db-journal' \
            \) -print >&2
            exit 1
          fi
          source_artifact="$(find .next/standalone -maxdepth 2 -type f \( -name 'AGENTS.md' -o -name 'CLAUDE.md' \) -print -quit)"
          if [[ -n "$source_artifact" ]]; then
            echo "Refusing to package source/documentation artifact: $source_artifact" >&2
            exit 1
          fi
          standalone_kb="$(du -sk .next/standalone | cut -f1)"
          if (( standalone_kb > 122880 )); then
            echo "Refusing oversized standalone artifact: ${standalone_kb} KiB" >&2
            exit 1
          fi

      - name: Package standalone
        run: |
          set -euo pipefail
          rm -rf release release.tar.gz brand-release brand-assets.tar.gz
          mkdir -p release/app/.next release/app/scripts release/app/deploy/nginx
          cp -R .next/standalone/. release/app/
          # Next bundles Better Auth for request handlers, but seed.mjs runs as
          # a separate Node process. Add its small dependency closure without
          # shipping the complete development node_modules tree.
          node scripts/package-seed-runtime.mjs release/app/node_modules
          node -e "const fs=require('fs'); const h=process.report?.getReport?.().header || {}; fs.writeFileSync('release/app/.runtime-abi.json', JSON.stringify({platform:process.platform,arch:process.arch,modules:process.versions.modules,libc:h.glibcVersionRuntime||null})+'\\n',{mode:0o644})"
          # public/ is a separately managed asset volume on the VPS; never
          # duplicate it inside the application release archive.
          rm -rf release/app/public
          cp -R .next/static release/app/.next/static
          cp scripts/seed.mjs release/app/scripts/seed.mjs
          cp scripts/migrate-auth.mjs release/app/scripts/migrate-auth.mjs
          cp scripts/migrate.mjs release/app/scripts/migrate.mjs
          cp scripts/backup-db.mjs release/app/scripts/backup-db.mjs
          cp scripts/dedupe-resources.mjs release/app/scripts/dedupe-resources.mjs
          cp scripts/check-db.mjs release/app/scripts/check-db.mjs
          cp scripts/prepare-pm2-config.mjs release/app/scripts/prepare-pm2-config.mjs
          cp scripts/resources-seed.json release/app/scripts/resources-seed.json
          cp deploy/nginx/dash-pr.conf release/app/deploy/nginx/dash-pr.conf

          # Exercise the exact scripts and dependency tree that will be used
          # for first-time VPS initialization, rather than only testing the
          # source checkout's hoisted node_modules.
          seed_smoke_dir="$RUNNER_TEMP/dash-seed-smoke"
          smoke_port=4318
          rm -rf "$seed_smoke_dir"
          mkdir -p "$seed_smoke_dir"
          (
            cd release/app
            NODE_ENV=production \
              BETTER_AUTH_SECRET=ci-seed-smoke-secret-012345678901234567890123 \
              BETTER_AUTH_URL="http://127.0.0.1:${smoke_port}" \
              DASH_PUBLIC_ORIGIN="http://127.0.0.1:${smoke_port}" \
              DASH_AUTH_DB="$seed_smoke_dir/dash-auth.db" \
              SEED_INITIAL_PASSWORD=ci-initial-pass-123 \
              SEED_ADMIN_PASSWORD=ci-admin-pass-123 \
              node scripts/seed.mjs
          )
          DASH_AUTH_DB="$seed_smoke_dir/dash-auth.db" \
            DASH_CHECK_DB_REQUIRE_RESOURCES=1 node release/app/scripts/check-db.mjs
          DASH_AUTH_DB="$seed_smoke_dir/dash-auth.db" node - <<'NODE'
          const Database = require('better-sqlite3');
          const db = new Database(process.env.DASH_AUTH_DB, { readonly: true, fileMustExist: true });
          const users = db.prepare('SELECT COUNT(*) AS count FROM user').get().count;
          const resources = db.prepare('SELECT COUNT(*) AS count FROM resources').get().count;
          if (users < 4 || resources < 1) throw new Error(`seed smoke failed: users=${users}, resources=${resources}`);
          db.close();
          NODE

          # Start the exact packaged server with a tiny private asset volume and
          # exercise auth, protected files, direct /files rewrites, browsing,
          # ZIP streaming, and the multipart upload boundary.
          mkdir -p release/app/public/assets release/app/public/files/corecoord/brand-system/logo
          printf 'standalone smoke file\n' > release/app/public/files/corecoord/brand-system/logo/ci-smoke.txt
          DASH_AUTH_DB="$seed_smoke_dir/dash-auth.db" node - <<'NODE'
          const Database = require('better-sqlite3');
          const db = new Database(process.env.DASH_AUTH_DB);
          db.prepare(`
            INSERT INTO resources
              (title, category, category_key, kind, format, size, dimensions, print_advice, file_key, preview, sort)
            VALUES (?, ?, ?, 'file', ?, ?, NULL, NULL, ?, NULL, 9999)
          `).run('CI smoke file', '品牌系统', 'brand-system', 'TXT', 22, 'files/corecoord/brand-system/logo/ci-smoke.txt');
          db.close();
          NODE
          smoke_release=ci-standalone-smoke
          smoke_log="$RUNNER_TEMP/dash-standalone-smoke.log"
          smoke_pid=""
          cleanup_smoke() {
            if [[ -n "$smoke_pid" ]]; then
              kill "$smoke_pid" 2>/dev/null || true
              wait "$smoke_pid" 2>/dev/null || true
            fi
            rm -rf release/app/public
          }
          trap cleanup_smoke EXIT
          (
            cd release/app
            NODE_ENV=production \
              BETTER_AUTH_SECRET=ci-seed-smoke-secret-012345678901234567890123 \
              BETTER_AUTH_URL="http://127.0.0.1:${smoke_port}" \
              DASH_AUTH_DB="$seed_smoke_dir/dash-auth.db" \
              DASH_RELEASE_ID="$smoke_release" \
              DASH_PUBLIC_ORIGIN="http://127.0.0.1:${smoke_port}" \
              PORT="$smoke_port" \
              exec node server.js > "$smoke_log" 2>&1
          ) &
          smoke_pid=$!
          smoke_ready=0
          attempt=0
          while (( attempt < 20 )); do
            attempt=$((attempt + 1))
            if curl --fail --silent --max-time 2 "http://127.0.0.1:${smoke_port}/api/health/live" >/dev/null 2>&1; then
              smoke_ready=1
              break
            fi
            sleep 1
          done
          if [[ "$smoke_ready" -ne 1 ]]; then
            tail -n 80 "$smoke_log" >&2 || true
            exit 1
          fi
          SMOKE_BASE_URL="http://127.0.0.1:${smoke_port}" \
            SMOKE_RELEASE_ID="$smoke_release" \
            SMOKE_ADMIN_PASSWORD=ci-admin-pass-123 \
            node scripts/smoke-standalone.mjs
          cleanup_smoke
          trap - EXIT

          # 二次断言放在 tar 之前，防止后续复制步骤重新带入数据库文件。
          db_artifact="$(find release/app \( -type f -o -type l \) \( \
            -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.db-journal' \
          \) -print -quit)"
          if [[ -n "$db_artifact" ]]; then
            echo "Refusing to package SQLite artifact: $db_artifact" >&2
            find release/app \( -type f -o -type l \) \( \
              -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.db-journal' \
            \) -print >&2
            exit 1
          fi
          source_artifact="$(find release/app -maxdepth 2 -type f \( -name 'AGENTS.md' -o -name 'CLAUDE.md' \) -print -quit)"
          if [[ -n "$source_artifact" ]]; then
            echo "Refusing to package source/documentation artifact: $source_artifact" >&2
            exit 1
          fi
          release_kb="$(du -sk release/app | cut -f1)"
          if (( release_kb > 122880 )); then
            echo "Refusing oversized release artifact: ${release_kb} KiB" >&2
            exit 1
          fi

          tar -czf release.tar.gz -C release/app .
          if tar -tzf release.tar.gz | grep -Eq '(^|/)[^/]+\.db(-wal|-shm|-journal)?$'; then
            echo "Refusing to deploy an archive containing SQLite artifacts" >&2
            tar -tzf release.tar.gz | grep -E '(^|/)[^/]+\.db(-wal|-shm|-journal)?$' >&2
            exit 1
          fi
          ls -lh release.tar.gz

          # Brand assets are versioned independently from the standalone app so
          # the external public volume can be updated atomically and archived.
          mkdir -p brand-release/assets/brand/corecoord
          cp -R deploy/brand/2026.1 brand-release/assets/brand/corecoord/2026.1
          CORECOORD_RESOURCE_ROOT=brand-release pnpm brand:materialize
          tar -czf brand-assets.tar.gz -C brand-release .
          brand_verify="$RUNNER_TEMP/corecoord-brand-verify"
          rm -rf "$brand_verify"
          mkdir -p "$brand_verify"
          if tar -tzf brand-assets.tar.gz | grep -Eiq '(^|/)(campaigns?|maker)(/|$)|(^|/)\.\.(/|$)|^/'; then
            echo "Refusing unsafe or excluded path in brand archive" >&2
            exit 1
          fi
          tar -xzf brand-assets.tar.gz -C "$brand_verify"
          brand_verify_root="$brand_verify/assets/brand/corecoord/2026.1"
          test -r "$brand_verify_root/manifest.json"
          test -r "$brand_verify_root/runtime-map.json"
          test -r "$brand_verify_root/checksums.sha256"
          (cd "$brand_verify_root" && sha256sum --quiet -c checksums.sha256)
          BRAND_VERIFY_ROOT="$brand_verify_root" BRAND_VERIFY_PACKAGE_ROOT="$brand_verify" node - <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");
          const manifest = JSON.parse(fs.readFileSync(process.env.BRAND_VERIFY_ROOT + "/manifest.json", "utf8"));
          const map = JSON.parse(fs.readFileSync(process.env.BRAND_VERIFY_ROOT + "/runtime-map.json", "utf8"));
          if (manifest.brand !== "CORECOORD" || manifest.release !== "2026.1") {
            throw new Error("invalid CORECOORD archive manifest");
          }
          const staticOnlyKinds = new Set(["font", "font-license", "font-documentation", "manual"]);
          const downloadable = new Set(manifest.files.filter((record) => !staticOnlyKinds.has(record.kind)).map((record) => record.path));
          const packageRoot = path.resolve(process.env.BRAND_VERIFY_PACKAGE_ROOT);
          let count = 0;
          const sources = new Set();
          for (const category of Object.values(map.categories || {})) {
            for (const copy of category.copies || []) {
              if (!downloadable.has(copy.sourcePath) || sources.has(copy.sourcePath)) {
                throw new Error("invalid or duplicate materialized resource source: " + copy.sourcePath);
              }
              sources.add(copy.sourcePath);
              const target = path.resolve(packageRoot, copy.fileKey);
              const targetStat = fs.lstatSync(target);
              if (!target.startsWith(path.join(packageRoot, "files") + path.sep) || !targetStat.isFile() || targetStat.isSymbolicLink() || targetStat.nlink > 1) {
                throw new Error("missing materialized resource: " + copy.fileKey);
              }
              const digest = crypto.createHash("sha256").update(fs.readFileSync(target)).digest("hex");
              if (targetStat.size !== Number(copy.bytes) || digest !== copy.sha256) {
                throw new Error("materialized resource checksum mismatch: " + copy.fileKey);
              }
              count += 1;
            }
          }
          if (count === 0 || sources.size !== downloadable.size) throw new Error("brand archive resource map is incomplete");
          console.log(`verified ${count} materialized CORECOORD resources`);
          NODE
          ls -lh brand-assets.tar.gz

      - name: Deploy to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DASH_HEALTH_URL: ${{ secrets.DASH_HEALTH_URL }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [[ -z "$DASH_HEALTH_URL" ]]; then
            echo "DASH_HEALTH_URL must be a public HTTPS origin so the deployed nginx boundary is probed" >&2
            exit 1
          fi
          if [[ -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "DEPLOY_KNOWN_HOSTS must contain the pinned VPS host key" >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/deploy_known_hosts
          chmod 600 ~/.ssh/deploy_known_hosts
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o "UserKnownHostsFile=$HOME/.ssh/deploy_known_hosts" -o StrictHostKeyChecking=yes)
          # Upload both artifacts into a run-specific directory. Fixed paths
          # allowed a failed second SCP to pair a new app with an old brand
          # archive on the next retry.
          bundle_id="${GITHUB_SHA:-unknown}-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}"
          bundle_id="${bundle_id//[^A-Za-z0-9_.-]/-}"
          incoming_dir="/opt/dash-pr/incoming/${bundle_id}"
          # The path is deliberately expanded on the runner before SSH.
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; mkdir -p -- '$incoming_dir'"
          sha256sum release.tar.gz brand-assets.tar.gz > bundle.sha256
          scp "${ssh_opts[@]}" release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$incoming_dir/release.tar.gz"
          scp "${ssh_opts[@]}" brand-assets.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$incoming_dir/brand-assets.tar.gz"
          scp "${ssh_opts[@]}" bundle.sha256 "$DEPLOY_USER@$DEPLOY_HOST:$incoming_dir/bundle.sha256"
          health_override_b64="$(printf '%s' "${DASH_HEALTH_URL:-}" | base64 -w 0)"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$health_override_b64" "$incoming_dir" <<'REMOTE_EOF'
          set -e
          HEALTH_OVERRIDE="$(printf '%s' "${1:-}" | base64 --decode)"
          INCOMING_DIR="${2:-}"
          case "$INCOMING_DIR" in
            /opt/dash-pr/incoming/*) ;;
            *) echo "invalid deployment incoming directory" >&2; exit 1 ;;
          esac
          RELEASE_ARCHIVE="$INCOMING_DIR/release.tar.gz"
          BRAND_ARCHIVE="$INCOMING_DIR/brand-assets.tar.gz"
          BUNDLE_DIGEST="$INCOMING_DIR/bundle.sha256"
          cleanup_incoming_bundle() {
            local status="$?"
            if [[ "$#" -gt 0 ]]; then status="$1"; fi
            trap - EXIT INT TERM HUP
            case "$INCOMING_DIR" in
              /opt/dash-pr/incoming/*) rm -rf -- "$INCOMING_DIR" 2>/dev/null || true ;;
            esac
            exit "$status"
          }
          trap cleanup_incoming_bundle EXIT
          trap 'cleanup_incoming_bundle 130' INT
          trap 'cleanup_incoming_bundle 143' TERM
          trap 'cleanup_incoming_bundle 129' HUP
          if [[ ! -r "$RELEASE_ARCHIVE" || ! -r "$BRAND_ARCHIVE" || ! -r "$BUNDLE_DIGEST" ]]; then
            echo "deployment bundle is incomplete" >&2
            exit 1
          fi
          mapfile -t bundle_files < <(awk '{print $2}' "$BUNDLE_DIGEST")
          if [[ "${#bundle_files[@]}" -ne 2 ]] || {
            [[ "${bundle_files[0]}" != "release.tar.gz" && "${bundle_files[0]}" != "brand-assets.tar.gz" ]] ||
            [[ "${bundle_files[1]}" != "release.tar.gz" && "${bundle_files[1]}" != "brand-assets.tar.gz" ]] ||
            [[ "${bundle_files[0]}" == "${bundle_files[1]}" ]]
          }; then
            echo "deployment bundle digest must cover exactly release.tar.gz and brand-assets.tar.gz" >&2
            exit 1
          fi
          (cd "$INCOMING_DIR" && sha256sum --quiet -c bundle.sha256)
          case "$HEALTH_OVERRIDE" in
            https://*) ;;
            *) echo "DASH_HEALTH_URL must be a public HTTPS origin" >&2; exit 1 ;;
          esac
          HEALTH_OVERRIDE="${HEALTH_OVERRIDE%/}"
          if [[ "$HEALTH_OVERRIDE" != "https://pr.dashedu.net" ]]; then
            echo "DASH_HEALTH_URL must be exactly https://pr.dashedu.net for this vhost" >&2
            exit 1
          fi
          umask 077
          mkdir -p /opt/dash-pr/incoming
          if ! command -v flock >/dev/null 2>&1; then
            echo "flock is required to serialize deployments" >&2
            exit 1
          fi
          exec 9>/opt/dash-pr/deploy.lock
          if ! flock -n 9; then
            echo "another deployment is already running" >&2
            exit 1
          fi
          # A brand release is briefly present in three forms: the uploaded
          # archive, the verified extraction, and the staged copy. Clean up
          # abandoned staging directories first, then fail early when the
          # volume cannot absorb the peak instead of failing mid-commit.
          if [[ -d /opt/dash-pr/public ]]; then
            find /opt/dash-pr/public -xdev -mindepth 1 -maxdepth 1 -type d \
              -name '.corecoord-stage.*' -mmin +60 -print -exec rm -rf -- {} +
          fi
          if [[ -d /opt/dash-pr/brand-releases ]]; then
            find /opt/dash-pr/brand-releases -xdev -mindepth 1 -maxdepth 1 -type d \
              -name 'brand.*' -mmin +60 -print -exec rm -rf -- {} +
          fi
          if [[ -d /opt/dash-pr/incoming ]]; then
            find /opt/dash-pr/incoming -xdev -mindepth 1 -maxdepth 1 -type d \
              -mmin +1440 ! -path "$INCOMING_DIR" -print -exec rm -rf -- {} +
          fi
          available_kb="$(df -Pk /opt/dash-pr/public 2>/dev/null | awk 'NR == 2 {print $4}')"
          release_archive_kb="$(du -k "$RELEASE_ARCHIVE" | awk '{print $1}')"
          brand_archive_kb="$(du -k "$BRAND_ARCHIVE" | awk '{print $1}')"
          if ! [[ "$available_kb" =~ ^[0-9]+$ && "$release_archive_kb" =~ ^[0-9]+$ && "$brand_archive_kb" =~ ^[0-9]+$ ]]; then
            echo "could not determine free space for deployment volume" >&2
            exit 1
          fi
          required_kb=$((262144 + release_archive_kb * 4 + brand_archive_kb * 4))
          if (( available_kb < required_kb )); then
            echo "insufficient free space on /opt/dash-pr/public: available=${available_kb}KiB required=${required_kb}KiB" >&2
            exit 1
          fi
          echo "deployment volume capacity: available=${available_kb}KiB required=${required_kb}KiB"
          NODE_BIN=""
          for candidate in /opt/node22/bin/node /opt/node22/node /usr/local/bin/node; do
            if [[ -x "$candidate" ]]; then
              NODE_BIN="$candidate"
              break
            fi
          done
          if [[ -z "$NODE_BIN" ]]; then
            NODE_BIN="$(command -v node 2>/dev/null || true)"
          fi
          if [[ -z "$NODE_BIN" || ! -x "$NODE_BIN" ]]; then
            echo "Node.js runtime not found; install Node 22 under /opt/node22 or expose it in PATH" >&2
            exit 1
          fi
          NODE_MAJOR="$("$NODE_BIN" -p "process.versions.node.split('.')[0]")"
          if [[ "$NODE_MAJOR" != "22" ]]; then
            echo "Node.js 22 is required for the packaged native modules (found $NODE_MAJOR)" >&2
            exit 1
          fi
          node_bin_dir="$(dirname "$NODE_BIN")"
          export PATH="$node_bin_dir:$PATH"
          PM2_BIN="$(dirname "$NODE_BIN")/pm2"
          if [[ ! -x "$PM2_BIN" ]]; then
            PM2_BIN="$(command -v pm2 2>/dev/null || true)"
          fi
          if [[ -z "$PM2_BIN" || ! -x "$PM2_BIN" ]]; then
            echo "PM2 executable not found for the selected Node.js runtime" >&2
            exit 1
          fi
          REL="$(mktemp -d /opt/dash-pr/releases/release.XXXXXXXX)"
          RELEASE_ID="$(basename "$REL")"
          PREV="$(readlink -f /opt/dash-pr/current 2>/dev/null || true)"
          if [[ -n "$PREV" && ! -d "$PREV" ]]; then
            echo "current points to a missing previous release: $PREV" >&2
            exit 1
          fi
          BRAND_REL=""
          BRAND_ROOT=""
          BRAND_STAGE=""
          BRAND_BACKUP_DIR="/opt/dash-pr/backups/brand/${RELEASE_ID}"
          BRAND_STATIC_TARGET="/opt/dash-pr/public/assets/brand/corecoord/2026.1"
          BRAND_RESOURCE_TARGET="/opt/dash-pr/public/files/corecoord"
          BRAND_COMMITTED=0
          BRAND_STATIC_BACKED_UP=0
          BRAND_RESOURCE_BACKED_UP=0
          BRAND_STATIC_INSTALLED=0
          BRAND_RESOURCE_INSTALLED=0
          restore_brand() {
            if [[ "$BRAND_COMMITTED" -ne 1 ]]; then
              return 0
            fi
            # Remove only paths installed by this release, then restore the
            # archived paths. The backup remains on disk for manual recovery.
            if [[ "$BRAND_STATIC_INSTALLED" -eq 1 ]]; then
              rm -rf "$BRAND_STATIC_TARGET" || return 1
            fi
            if [[ "$BRAND_RESOURCE_INSTALLED" -eq 1 ]]; then
