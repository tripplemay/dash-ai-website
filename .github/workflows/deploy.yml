            fi
            ln -sfn "$REL" /opt/dash-pr/current.new
            mv -T /opt/dash-pr/current.new /opt/dash-pr/current
            KEEP_RELEASE=1
            echo "release staged at /opt/dash-pr/current; run the documented seed command, then rerun deployment" >&2
            exit 1
          fi
          chmod 600 /opt/dash-pr/dash-auth.db
          for db_sidecar in /opt/dash-pr/dash-auth.db-wal /opt/dash-pr/dash-auth.db-shm /opt/dash-pr/dash-auth.db-journal; do
            [[ -e "$db_sidecar" ]] && chmod 600 "$db_sidecar"
          done
          DASH_AUTH_DB=/opt/dash-pr/dash-auth.db \
            DASH_CHECK_DB_AUTH_ONLY=1 "$NODE_BIN" "$REL/scripts/check-db.mjs"
          DASH_AUTH_DB=/opt/dash-pr/dash-auth.db \
            DASH_BACKUP_DIR=/opt/dash-pr/backups \
            "$NODE_BIN" "$REL/scripts/backup-db.mjs"
          DASH_AUTH_DB=/opt/dash-pr/dash-auth.db "$NODE_BIN" "$REL/scripts/migrate-auth.mjs"
          DASH_AUTH_DB=/opt/dash-pr/dash-auth.db "$NODE_BIN" "$REL/scripts/migrate.mjs"
          DASH_AUTH_DB=/opt/dash-pr/dash-auth.db \
            DASH_CHECK_DB_REQUIRE_RESOURCES=1 "$NODE_BIN" "$REL/scripts/check-db.mjs"
          HEALTH_URL="$HEALTH_OVERRIDE"
          NGINX_BACKUP_DIR="/opt/dash-pr/backups/nginx"
          NGINX_AVAILABLE="/etc/nginx/sites-available/dash-pr"
          NGINX_ENABLED="/etc/nginx/sites-enabled/dash-pr"
          NGINX_AVAILABLE_BACKUP="$NGINX_BACKUP_DIR/${RELEASE_ID}.available"
          NGINX_ENABLED_BACKUP="$NGINX_BACKUP_DIR/${RELEASE_ID}.enabled"
          NGINX_BACKUP_DONE=0
          backup_nginx() {
            if ! sudo -n true 2>/dev/null; then
              echo "deploy user does not have passwordless sudo for nginx installation" >&2
              return 1
            fi
            sudo -n mkdir -p "$NGINX_BACKUP_DIR"
            sudo -n rm -f "$NGINX_AVAILABLE_BACKUP" "$NGINX_ENABLED_BACKUP"
            if sudo -n test -e "$NGINX_AVAILABLE" || sudo -n test -L "$NGINX_AVAILABLE"; then
              sudo -n cp -a "$NGINX_AVAILABLE" "$NGINX_AVAILABLE_BACKUP"
            fi
            if sudo -n test -e "$NGINX_ENABLED" || sudo -n test -L "$NGINX_ENABLED"; then
              sudo -n cp -a "$NGINX_ENABLED" "$NGINX_ENABLED_BACKUP"
            fi
            NGINX_BACKUP_DONE=1
          }
          restore_nginx() {
            if [[ "$NGINX_BACKUP_DONE" -ne 1 ]]; then return 0; fi
            sudo -n rm -f "$NGINX_ENABLED" "$NGINX_AVAILABLE"
            if sudo -n test -e "$NGINX_AVAILABLE_BACKUP" || sudo -n test -L "$NGINX_AVAILABLE_BACKUP"; then
              sudo -n cp -a "$NGINX_AVAILABLE_BACKUP" "$NGINX_AVAILABLE"
            fi
            if sudo -n test -e "$NGINX_ENABLED_BACKUP" || sudo -n test -L "$NGINX_ENABLED_BACKUP"; then
              sudo -n cp -a "$NGINX_ENABLED_BACKUP" "$NGINX_ENABLED"
            fi
            if ! sudo -n nginx -t; then
              echo "restored nginx configuration is invalid" >&2
              return 1
            fi
            sudo -n systemctl reload nginx
          }
          install_nginx() {
            if [[ ! -r "$REL/deploy/nginx/dash-pr.conf" ]]; then
              echo "release is missing deploy/nginx/dash-pr.conf" >&2
              return 1
            fi
            if ! sudo -n test -d /etc/nginx/sites-available || ! sudo -n test -d /etc/nginx/sites-enabled; then
              echo "nginx Debian sites-available/sites-enabled directories are required" >&2
              return 1
            fi
            for certificate in /etc/letsencrypt/live/pr.dashedu.net/fullchain.pem /etc/letsencrypt/live/pr.dashedu.net/privkey.pem; do
              if ! sudo -n test -r "$certificate"; then
                echo "TLS certificate is missing or unreadable: $certificate; provision the pr.dashedu.net certificate before deploying" >&2
                return 1
              fi
            done
            conflicting_vhosts=""
            while IFS= read -r candidate; do
              [[ "$candidate" == "$NGINX_AVAILABLE" || "$candidate" == "$NGINX_ENABLED" ]] && continue
              conflicting_vhosts+=" $candidate"
            done < <(sudo -n grep -RIl --exclude='*.bak' -E 'server_name[[:space:]]+pr\.dashedu\.net([;[:space:]])' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true)
            if [[ -n "$conflicting_vhosts" ]]; then
              echo "another nginx vhost already declares pr.dashedu.net:$conflicting_vhosts; disable it before deploying" >&2
              return 1
            fi
            backup_nginx || return 1
            sudo -n install -m 0644 "$REL/deploy/nginx/dash-pr.conf" "$NGINX_AVAILABLE"
            sudo -n ln -sfn "$NGINX_AVAILABLE" "$NGINX_ENABLED"
            if ! sudo -n nginx -t; then
              echo "new nginx configuration is invalid; restoring previous files" >&2
              restore_nginx || true
              return 1
            fi
            if ! sudo -n systemctl reload nginx; then
              echo "nginx reload failed; restoring previous files" >&2
              restore_nginx || true
              return 1
            fi
          }
          restore_previous() {
            # A rollback can fail after PM2 has accepted a new process. Keep
            # the candidate release in that ambiguous state so it remains
            # available for manual recovery and diagnostics.
            KEEP_RELEASE=1
            if ! restore_brand; then
              echo "brand asset rollback failed" >&2
              return 1
            fi
            if ! restore_nginx; then
              echo "nginx rollback failed" >&2
              return 1
            fi
            if [[ -n "$PREV" ]]; then
              previous_release_id="$(basename "$PREV")"
              ln -sfn "$PREV" /opt/dash-pr/current
              ROLLBACK_PM2_CONFIG="/tmp/dash-pr-${previous_release_id}.ecosystem.config.js"
              if ! "$NODE_BIN" "$REL/scripts/prepare-pm2-config.mjs" \
                /opt/dash-pr/ecosystem.config.js "$ROLLBACK_PM2_CONFIG" "$HEALTH_URL" "$previous_release_id"; then
                echo "could not generate PM2 rollback config" >&2
                return 1
              fi
              if ! "$PM2_BIN" startOrReload "$ROLLBACK_PM2_CONFIG" --env production --update-env; then
                echo "PM2 rollback failed for previous release" >&2
                return 1
              fi
              restored=0
              rollback_attempt=0
              while (( rollback_attempt < 20 )); do
                rollback_attempt=$((rollback_attempt + 1))
                rollback_live="$(curl --fail --silent --show-error --max-time 3 "${HEALTH_URL}/api/health/live" || true)"
                rollback_ready="$(curl --fail --silent --show-error --max-time 3 "${HEALTH_URL}/api/health/ready" || true)"
                rollback_live_code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 "${HEALTH_URL}/api/health/live" || true)"
                rollback_ready_code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 "${HEALTH_URL}/api/health/ready" || true)"
                if [[ "$rollback_live_code" == "200" && "$rollback_ready_code" == "200" ]] \
                  && { [[ "$rollback_live" == *"\"release\":\"$previous_release_id\""* ]] \
                    || [[ "$rollback_live" == *'"status":"ok"'* ]]; } \
                  && [[ "$rollback_ready" == *'"status":"ok"'* ]]; then
                  restored=1
                  break
                fi
                # Releases created before the health routes were introduced
                # legitimately return 404. Verify their public login page so
                # the first upgrade can still roll back safely.
                if [[ "$rollback_live_code" == "404" || "$rollback_ready_code" == "404" ]]; then
                  legacy_code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 "${HEALTH_URL}/zh/login" || true)"
                  if [[ "$legacy_code" =~ ^[23][0-9][0-9]$ ]]; then
                    restored=1
                    break
                  fi
                fi
                sleep 1
              done
              if [[ "$restored" -ne 1 ]]; then
                echo "previous release failed post-rollback health checks: $previous_release_id" >&2
                return 1
              fi
              rm -f "$ROLLBACK_PM2_CONFIG"
              KEEP_RELEASE=0
            else
              if [[ "$(readlink -f /opt/dash-pr/current 2>/dev/null || true)" == "$REL" ]]; then
                rm -f /opt/dash-pr/current
              fi
              "$PM2_BIN" delete "$APP_NAME" >/dev/null 2>&1 || true
              KEEP_RELEASE=0
            fi
            return 0
          }
          ln -sfn "$REL" /opt/dash-pr/current.new
          mv -T /opt/dash-pr/current.new /opt/dash-pr/current
          if "$PM2_BIN" startOrReload "$PM2_CONFIG" --env production --update-env; then
            :
          else
            if restore_previous; then
              echo "pm2 failed; previous release restored" >&2
            else
              echo "pm2 failed; manual rollback is required" >&2
            fi
            exit 1
          fi
          if ! install_nginx; then
            echo "nginx installation failed; restoring previous application" >&2
            if ! restore_previous; then
              echo "automatic rollback after nginx failure failed; manual intervention is required" >&2
            fi
            exit 1
          fi
          # Do not leave current pointing at a process that failed after PM2
          # accepted the reload. The required public health URL also exercises
          # the nginx /files authentication boundary.
          healthy=0
          attempt=0
          while (( attempt < 20 )); do
            attempt=$((attempt + 1))
            live_body="$(curl --fail --silent --show-error --max-time 3 "${HEALTH_URL}/api/health/live" || true)"
            ready_body="$(curl --fail --silent --show-error --max-time 3 "${HEALTH_URL}/api/health/ready" || true)"
            if [[ "$live_body" == *"\"release\":\"$RELEASE_ID\""* ]] \
              && [[ "$ready_body" == *"\"release\":\"$RELEASE_ID\""* ]]; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [[ "$healthy" -ne 1 ]]; then
            echo "health check failed after deploy; backup remains in /opt/dash-pr/backups" >&2
            diagnose_runtime
            if ! restore_previous; then
              echo "automatic PM2 rollback failed; manual intervention is required" >&2
            fi
            exit 1
          fi
          for public_path in \
            /assets/brand/corecoord/2026.1/logo-final-2026/vector/corecoord-logo-horizontal-color.svg \
            /assets/brand/corecoord/2026.1/vi-system-2026/manual/index.html \
            /assets/brand/corecoord/2026.1/vi-system-2026/deliverables/tokens/corecoord.css; do
            public_status="$(curl --silent --show-error --output /tmp/dash-brand-probe --write-out '%{http_code}' --max-time 5 "${HEALTH_URL}${public_path}" || true)"
            if [[ "$public_status" != "200" ]]; then
              echo "public CORECOORD asset probe failed for $public_path (status=$public_status)" >&2
              diagnose_runtime
              if ! restore_previous; then
                echo "automatic PM2 rollback after brand probe failure failed; manual intervention is required" >&2
              fi
              exit 1
            fi
          done
          # These deliverables are also materialized under /files/corecoord,
          # so their public static aliases must remain behind auth_request.
          # Probe without a session to catch location-order regressions that
          # would otherwise expose the protected copy through /assets.
          for protected_brand_path in \
            /assets/brand/corecoord/2026.1/vi-system-2026/manual/output/pdf/CORECOORD-VI-System-2026.1-zh-CN.pdf \
            /assets/brand/corecoord/2026.1/vi-system-2026/deliverables/templates/course/corecoord-presentation-cover-16x9.svg; do
            protected_brand_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "${HEALTH_URL}${protected_brand_path}" || true)"
            if [[ "$protected_brand_status" != "401" ]]; then
              echo "protected CORECOORD asset probe expected 401 without a session for $protected_brand_path, got $protected_brand_status" >&2
              diagnose_runtime
              if ! restore_previous; then
                echo "automatic PM2 rollback after protected brand probe failure failed; manual intervention is required" >&2
              fi
              exit 1
            fi
          done
          for legacy_path in /assets/legacy-brand-probe.png /assets/ext/legacy-brand-probe.png /assets/img/legacy-brand-probe.png /assets/icons/legacy-brand-probe.png; do
            legacy_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "${HEALTH_URL}${legacy_path}" || true)"
            if [[ "$legacy_status" != "410" ]]; then
              echo "retired legacy asset path was not blocked: $legacy_path (status=$legacy_status)" >&2
              diagnose_runtime
              if ! restore_previous; then
                echo "automatic PM2 rollback after legacy asset probe failure failed; manual intervention is required" >&2
              fi
              exit 1
            fi
          done
          for protected_path in \
            /files \
            /files/__dash_auth_probe__; do
            files_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 "${HEALTH_URL}${protected_path}" || true)"
            if [[ "$files_status" != "401" ]]; then
              echo "protected $protected_path probe expected 401 without a session, got $files_status" >&2
              diagnose_runtime
              if ! restore_previous; then
                echo "automatic PM2 rollback failed; manual intervention is required" >&2
              fi
              exit 1
            fi
          done
          # From this point current/PM2 is healthy. Keep the release even if a
          # later housekeeping command fails; deleting it would invalidate the
          # process that is serving traffic.
          KEEP_RELEASE=1
          "$PM2_BIN" save
          rm -rf "$INCOMING_DIR"
          "$NODE_BIN" -e "const fs=require('fs'); const path=require('path'); const root='/opt/dash-pr/releases'; const keep=fs.readdirSync(root,{withFileTypes:true}).filter((e)=>e.isDirectory() && /^release\\.[A-Za-z0-9]+$/.test(e.name)).map((e)=>{const p=path.join(root,e.name); return {p,mtime:fs.statSync(p).mtimeMs};}).sort((a,b)=>b.mtime-a.mtime).slice(5); for(const item of keep) fs.rmSync(item.p,{recursive:true,force:true})"
          "$NODE_BIN" -e "const fs=require('fs'); const path=require('path'); const root='/opt/dash-pr/backups/brand'; if(fs.existsSync(root)){const keep=fs.readdirSync(root,{withFileTypes:true}).filter((e)=>e.isDirectory() && /^release\\.[A-Za-z0-9]+$/.test(e.name)).map((e)=>{const p=path.join(root,e.name); return {p,mtime:fs.statSync(p).mtimeMs};}).sort((a,b)=>b.mtime-a.mtime).slice(5); for(const item of keep) fs.rmSync(item.p,{recursive:true,force:true})}"
          echo "deployed: $REL"
          REMOTE_EOF
