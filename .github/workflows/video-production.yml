name: video-production-tests

on:
  push:
    paths:
      - 'tools/video-production/**'
      - 'docs/video-production/**'
      - '.github/workflows/video-production.yml'
  pull_request:
    paths:
      - 'tools/video-production/**'
      - 'docs/video-production/**'
      - '.github/workflows/video-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolkit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate toolkit
        run: |
          python -m unittest discover -s tools/video-production/tests -v
          node --check tools/video-production/web/app.js
